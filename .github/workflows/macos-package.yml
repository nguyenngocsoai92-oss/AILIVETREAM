name: Build macOS disk image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/macos-package.yml'
      - 'package-macos.cjs'
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test && npm run typecheck
      - run: npm run package:mac
      - name: Sign preview bundle and build disk image
        run: |
          set -euo pipefail
          app="mac-release/SN AI LIVE STUDIO-darwin-$ARCH/SN AI LIVE STUDIO.app"
          staging="$(mktemp -d)"
          mount=$(mktemp -d)
          cleanup() {
            hdiutil detach "$mount" >/dev/null 2>&1 || true
            rmdir "$mount" || true
            rm -rf "$staging"
          }
          trap cleanup EXIT
          staged_app="$staging/SN AI LIVE STUDIO.app"
          ditto "$app" "$staged_app"
          codesign --force --deep --sign - "$staged_app"
          codesign --verify --deep --strict --verbose=2 "$staged_app"
          ln -s /Applications "$staging/Applications"
          target="mac-release/SN-AI-LIVE-STUDIO-macOS-$ARCH-preview.dmg"
          built=false
          for attempt in 1 2 3; do
            if hdiutil create -ov -format UDZO -fs APFS -volname 'SN AI LIVE STUDIO' -srcfolder "$staging" "$target"; then
              built=true
              break
            fi
            sleep "$((attempt * 3))"
          done
          test "$built" = true
          hdiutil verify "$target"
          hdiutil attach "$target" -nobrowse -readonly -mountpoint "$mount"
          mounted_app="$mount/SN AI LIVE STUDIO.app"
          codesign --verify --deep --strict --verbose=2 "$mounted_app"
          "$mounted_app/Contents/MacOS/SN AI LIVE STUDIO" --smoke-test
          if ! spctl --assess --type execute -vv "$mounted_app"; then
            echo '::warning::Preview build does not pass Gatekeeper distribution assessment. Use the Developer ID release workflow for distribution.'
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: SN-AI-LIVE-STUDIO-macOS-${{ matrix.arch }}-preview
          path: mac-release/*-preview.dmg
          if-no-files-found: error
