name: Build macOS disk image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/macos-package.yml'
      - 'package-macos.cjs'
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run package:mac
      - name: Verify and archive macOS app
        run: |
          set -euo pipefail
          app="mac-release/SN AI LIVE STUDIO-darwin-$ARCH/SN AI LIVE STUDIO.app"
          test -f "$app/Contents/Resources/app.asar"
          "$app/Contents/MacOS/SN AI LIVE STUDIO" --smoke-test
          ditto -c -k --sequesterRsrc --keepParent "$app" "mac-release/SN-AI-LIVE-STUDIO-macOS-$ARCH-app.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: SN-AI-LIVE-STUDIO-macOS-${{ matrix.arch }}-app
          path: mac-release/*-app.zip
          if-no-files-found: error
      - name: Build and verify disk image
        run: |
          set -euo pipefail
          app="mac-release/SN AI LIVE STUDIO-darwin-$ARCH/SN AI LIVE STUDIO.app"
          staging="$(mktemp -d)"
          trap 'rm -rf "$staging"' EXIT
          ditto "$app" "$staging/SN AI LIVE STUDIO.app"
          ln -s /Applications "$staging/Applications"
          target="mac-release/SN-AI-LIVE-STUDIO-macOS-$ARCH.dmg"
          for attempt in 1 2 3; do
            if hdiutil create -ov -format UDZO -fs APFS -volname 'SN AI LIVE STUDIO' -srcfolder "$staging" "$target"; then
              hdiutil verify "$target"
              exit 0
            fi
            sleep "$((attempt * 3))"
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: SN-AI-LIVE-STUDIO-macOS-${{ matrix.arch }}
          path: mac-release/*.dmg
          if-no-files-found: error
